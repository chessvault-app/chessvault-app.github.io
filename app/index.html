         do not zoom the whole app, which no app does. maximum-scale=1 and
         user-scalable=no are half of that, honoured by Android and by the
         home-screen app on iOS; a Safari tab ignores both, and there
         body's touch-action (index.css) withholds the pinch instead, so
         the two together are the whole lock. They were dropped in 0.9.6
         for WCAG 1.4.4 and are back by the owner's decision of
         2026-09-16: enlarging text is still the browser's or the OS's own
         text size, which this app's rem-based type follows, and Safari's
         own page zoom, neither of which the cap touches. iOS auto-zoom on
         a focused field is declined where it is caused rather than by the
         cap — components/ui/input gives its fields a 16px font on a
         coarse pointer — so the cap is not load-bearing for that. What
         reads two fingers for itself is unaffected, because touch-action
         never withholds a touch or gesture listener: the book reader's
         page, the evidence pages and the opening map still pinch what
