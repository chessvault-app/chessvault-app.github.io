    <!-- Nothing caps the scale: a pinch has to be able to enlarge the app,
         which is WCAG 1.4.4 and the one way to read a phone screen that is
         too small for the eyes using it. maximum-scale=1 and
         user-scalable=no were here until 0.9.6, to stop two fingers on the
         shell zooming the whole page; the reading now is that a gesture
         nobody has to use costs less than an app that cannot be enlarged.
         iOS auto-zoom on a focused field is declined where it is caused
         instead — components/ui/input gives its fields a 16px font on a
         coarse pointer — rather than by taking zooming away from everyone.
         The surfaces that read their own touches hold the page still
         themselves, in their own touch-action: the board, the book
         reader's page, the evidence pages, the opening map and the bottom
         bar. -->

    <script>
      // Set the theme class before first paint so dark-theme users never see a
      // white flash. Mirrors the resolution logic in src/store/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem('chess-vault:theme');
          var pref = raw ? JSON.parse(raw).state.preference : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // Pin the page's ground to the RESOLVED theme (inline style beats
          // the media query above): the stored preference can disagree with
          // the OS, and the ground must be the app's colour, not the OS's.
          // The colour is the one the page last resolved to under its
          // scheme, where the app has stored one; the default otherwise.
          var grounds = localStorage.getItem('chess-vault:ground');
          var ground = grounds ? JSON.parse(grounds)[dark ? 'dark' : 'light'] : null;
          document.documentElement.style.backgroundColor =
            typeof ground === 'string' && ground ? ground : dark ? '#0a0a0a' : '#f5f5f5';
        } catch (e) {
          /* first run, or storage blocked — fall through to light */
        }
